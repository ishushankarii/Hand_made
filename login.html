<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ishwarya Hand Made Shopping Market - Login</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                135deg,
                #f8bbd0,
                #ce93d8,
                #ffcc80
            );
        }

        /* Decorative Symbols */

        .decorations {
            position: fixed;
            top: 12px;
            left: 0;

            width: 100%;

            display: flex;
            justify-content: space-around;

            font-size: 28px;
        }

        /* Main Card */

        .login-card {
            width: 850px;

            display: flex;

            background: white;

            border-radius: 25px;

            overflow: hidden;

            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        /* Left Side */

        .handmade-side {
            width: 45%;

            padding: 55px 35px;

            color: white;

            text-align: center;

            background: linear-gradient(
                160deg,
                #ad1457,
                #8e24aa,
                #f57c00
            );
        }

        .handmade-icon {
            font-size: 65px;

            margin-bottom: 20px;
        }

        .handmade-side h1 {
            font-size: 34px;

            line-height: 1.3;

            margin-bottom: 12px;
        }

        .handmade-side h3 {
            font-size: 18px;

            font-weight: normal;

            margin-bottom: 20px;
        }

        .handmade-side p {
            font-size: 16px;

            line-height: 1.7;
        }

        .quote {
            margin-top: 30px;

            font-size: 17px;

            font-weight: bold;
        }

        /* Right Side */

        .login-side {
            width: 55%;

            padding: 55px 45px;
        }

        .login-side h2 {
            text-align: center;

            font-size: 30px;

            color: #8e24aa;

            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;

            color: #777;

            margin-bottom: 30px;
        }

        /* Input */

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-weight: bold;

            color: #444;
        }

        input {
            width: 100%;

            padding: 13px;

            border: 2px solid #eee;

            border-radius: 9px;

            font-size: 15px;
        }

        input:focus {
            outline: none;

            border-color: #ad1457;
        }

        /* Forgot Password */

        .forgot {
            text-align: right;

            margin-bottom: 20px;
        }

        .forgot a {
            color: #ad1457;

            text-decoration: none;

            font-size: 14px;
        }

        /* Login Button */

        .login-btn {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 9px;

            background: linear-gradient(
                90deg,
                #ad1457,
                #8e24aa,
                #f57c00
            );

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;
        }

        .login-btn:hover {
            opacity: 0.9;
        }

        /* Register */

        .register {
            text-align: center;

            margin-top: 22px;

            color: #555;
        }

        .register a {
            color: #ad1457;

            font-weight: bold;

            text-decoration: none;
        }

        .register a:hover {
            text-decoration: underline;
        }

        /* Mobile */

        @media (max-width: 768px) {

            .login-card {
                width: 90%;

                flex-direction: column;
            }

            .handmade-side,
            .login-side {
                width: 100%;
            }

            .handmade-side {
                padding: 35px 25px;
            }

            .handmade-side h1 {
                font-size: 28px;
            }

            .login-side {
                padding: 35px 25px;
            }
        }

    </style>

</head>


<body>


    <!-- Decorations -->

    <div class="decorations">

        🌸
        🧶
        🪡
        👜
        🎨
        🌸
        🧶

    </div>


    <!-- Login Card -->

    <div class="login-card">


        <!-- Handmade Section -->

        <div class="handmade-side">

            <div class="handmade-icon">
                🧶 🪡 🎨
            </div>

            <h1>
                Ishwarya
            </h1>

            <h3>
                Hand Made Shopping Market
            </h3>

            <p>
                Discover beautiful handmade
                products created with creativity,
                care and love.
            </p>

            <div class="quote">
                Create • Shop • Love
            </div>

        </div>


        <!-- Login Section -->

        <div class="login-side">

            <h2>
                Welcome Back!
            </h2>

            <p class="subtitle">
                Login to explore handmade products
            </p>


            <form action="home.html">


                <!-- Email -->

                <div class="input-group">

                    <label>
                        Email
                    </label>

                    <input
                        type="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- Password -->

                <div class="input-group">

                    <label>
                        Password
                    </label>

                    <input
                        type="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <!-- Forgot Password -->

                <div class="forgot">

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>


                <!-- Login -->

                <button
                    type="submit"
                    class="login-btn">

                    Login

                </button>

            </form>


            <!-- Register -->

            <div class="register">

                Don't have an account?

                <a href="register.html">
                    Register
                </a>

            </div>

        </div>

    </div>


</body>

</html>
