<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order History | Aishu Mart</title>
    <link rel="stylesheet" href="order-history.css">
</head>

<body>

    <!-- Navbar -->
    <header class="navbar">

        <div class="logo">
            🛍️ Aishu Mart
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="categories.html">Categories</a>
            <a href="cart.html">🛒 Cart</a>
            <a href="order-history.html" class="active">
                Orders
            </a>
        </nav>

    </header>


    <!-- Page Header -->
    <section class="history-header">

        <h1>📦 Order History</h1>

        <p>
            Track and view all your Aishu Mart orders
        </p>

    </section>


    <!-- Order History -->
    <section class="history-section">

        <div class="history-container">

            <!-- Orders -->
            <div id="ordersContainer">

                <!-- Orders will appear here -->

            </div>


            <!-- Empty Orders -->
            <div
                class="empty-orders"
                id="emptyOrders"
            >

                <div class="empty-icon">
                    📦
                </div>

                <h2>No Orders Yet</h2>

                <p>
                    You haven't placed any orders yet.
                </p>

                <a
                    href="products.html"
                    class="shop-btn"
                >
                    Start Shopping
                </a>

            </div>

        </div>

    </section>


    <!-- Footer -->
    <footer>

        <p>
            © 2026 Aishu Mart | Handmade with ❤️
        </p>

    </footer>


    <script src="order-history.js"></script>

</body>
</html>
