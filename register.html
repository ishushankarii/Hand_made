<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ishwarya Hand Made Shopping Market - Register</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                135deg,
                #f8bbd0,
                #ce93d8,
                #ffcc80
            );
        }

        /* Decorations */

        .decorations {
            position: fixed;
            top: 12px;
            left: 0;

            width: 100%;

            display: flex;
            justify-content: space-around;

            font-size: 28px;
        }

        /* Main Card */

        .register-card {
            width: 850px;

            display: flex;

            background: white;

            border-radius: 25px;

            overflow: hidden;

            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        /* Left Side */

        .handmade-side {
            width: 42%;

            padding: 50px 30px;

            color: white;

            text-align: center;

            background: linear-gradient(
                160deg,
                #ad1457,
                #8e24aa,
                #f57c00
            );
        }

        .handmade-icon {
            font-size: 60px;

            margin-bottom: 20px;
        }

        .handmade-side h1 {
            font-size: 34px;

            line-height: 1.3;

            margin-bottom: 12px;
        }

        .handmade-side h3 {
            font-size: 18px;

            font-weight: normal;

            margin-bottom: 20px;
        }

        .handmade-side p {
            font-size: 16px;

            line-height: 1.7;
        }

        .quote {
            margin-top: 30px;

            font-size: 17px;

            font-weight: bold;
        }

        /* Form Side */

        .form-side {
            width: 58%;

            padding: 40px 45px;
        }

        .form-side h2 {
            text-align: center;

            font-size: 29px;

            color: #8e24aa;

            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;

            color: #777;

            margin-bottom: 24px;
        }

        /* Input */

        .input-group {
            margin-bottom: 13px;
        }

        label {
            display: block;

            margin-bottom: 6px;

            font-weight: bold;

            color: #444;
        }

        input,
        textarea {
            width: 100%;

            padding: 11px;

            border: 2px solid #eee;

            border-radius: 8px;

            font-size: 14px;
        }

        input:focus,
        textarea:focus {
            outline: none;

            border-color: #ad1457;
        }

        textarea {
            height: 55px;

            resize: none;
        }

        /* Register Button */

        .register-btn {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: linear-gradient(
                90deg,
                #ad1457,
                #8e24aa,
                #f57c00
            );

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;
        }

        .register-btn:hover {
            opacity: 0.9;
        }

        /* Login */

        .login-text {
            text-align: center;

            margin-top: 18px;

            color: #555;
        }

        .login-text a {
            color: #ad1457;

            font-weight: bold;

            text-decoration: none;
        }

        .login-text a:hover {
            text-decoration: underline;
        }

        /* Mobile */

        @media (max-width: 768px) {

            .register-card {
                width: 90%;

                flex-direction: column;
            }

            .handmade-side,
            .form-side {
                width: 100%;
            }

            .handmade-side {
                padding: 30px 20px;
            }

            .handmade-side h1 {
                font-size: 28px;
            }

            .form-side {
                padding: 30px 25px;
            }

        }

    </style>

</head>


<body>


    <!-- Decorations -->

    <div class="decorations">

        🌸
        🧶
        🪡
        👜
        🎨
        🌸
        🧶

    </div>


    <!-- Register Card -->

    <div class="register-card">


        <!-- Handmade Section -->

        <div class="handmade-side">

            <div class="handmade-icon">
                🧶 🪡 🎨
            </div>

            <h1>
                Ishwarya
            </h1>

            <h3>
                Hand Made Shopping Market
            </h3>

            <p>
                Create your account and
                discover beautiful handmade
                products crafted with care.
            </p>

            <div class="quote">
                Create • Shop • Love
            </div>

        </div>


        <!-- Registration Form -->

        <div class="form-side">

            <h2>
                Create Your Account
            </h2>

            <p class="subtitle">
                Join our handmade shopping market
            </p>


            <form action="login.html">


                <!-- Full Name -->

                <div class="input-group">

                    <label>
                        Full Name
                    </label>

                    <input
                        type="text"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- Email -->

                <div class="input-group">

                    <label>
                        Email
                    </label>

                    <input
                        type="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- Phone -->

                <div class="input-group">

                    <label>
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        placeholder="Enter your phone number"
                        required
                    >

                </div>


                <!-- Password -->

                <div class="input-group">

                    <label>
                        Password
                    </label>

                    <input
                        type="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <!-- Confirm Password -->

                <div class="input-group">

                    <label>
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <!-- Address -->

                <div class="input-group">

                    <label>
                        Address
                    </label>

                    <textarea
                        placeholder="Enter your address">
                    </textarea>

                </div>


                <!-- Register Button -->

                <button
                    type="submit"
                    class="register-btn">

                    Create Account

                </button>

            </form>


            <!-- Login Link -->

            <div class="login-text">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </div>

        </div>

    </div>


</body>

</html>
