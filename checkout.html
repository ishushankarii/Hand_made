<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Aishu Mart</title>
    <link rel="stylesheet" href="checkout.css">
</head>

<body>

    <!-- Navbar -->
    <header class="navbar">
        <div class="logo">🛍️ Aishu Mart</div>

        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="categories.html">Categories</a>
            <a href="cart.html">🛒 Cart</a>
            <a href="login.html">Login</a>
        </nav>
    </header>


    <!-- Page Header -->
    <section class="checkout-header">
        <h1>Checkout</h1>
        <p>Complete your order securely</p>
    </section>


    <!-- Checkout -->
    <section class="checkout-section">

        <div class="checkout-container">

            <!-- Customer Details -->
            <div class="customer-box">

                <h2>📦 Delivery Information</h2>

                <form id="checkoutForm">

                    <div class="form-row">

                        <div class="form-group">
                            <label>First Name</label>
                            <input
                                type="text"
                                id="firstName"
                                placeholder="Enter first name"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label>Last Name</label>
                            <input
                                type="text"
                                id="lastName"
                                placeholder="Enter last name"
                                required
                            >
                        </div>

                    </div>


                    <div class="form-group">
                        <label>Email Address</label>

                        <input
                            type="email"
                            id="email"
                            placeholder="example@gmail.com"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label>Phone Number</label>

                        <input
                            type="tel"
                            id="phone"
                            placeholder="Enter phone number"
                            pattern="[0-9]{10}"
                            maxlength="10"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label>Address</label>

                        <textarea
                            id="address"
                            rows="4"
                            placeholder="House / Door No, Street, Area"
                            required
                        ></textarea>
                    </div>


                    <div class="form-row">

                        <div class="form-group">
                            <label>City</label>

                            <input
                                type="text"
                                id="city"
                                placeholder="Enter city"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label>State</label>

                            <input
                                type="text"
                                id="state"
                                placeholder="Enter state"
                                required
                            >
                        </div>

                    </div>


                    <div class="form-row">

                        <div class="form-group">
                            <label>Pincode</label>

                            <input
                                type="text"
                                id="pincode"
                                placeholder="6-digit pincode"
                                pattern="[0-9]{6}"
                                maxlength="6"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label>Country</label>

                            <input
                                type="text"
                                value="India"
                                id="country"
                                readonly
                            >
                        </div>

                    </div>


                    <button type="submit" class="continue-btn">
                        Continue to Payment →
                    </button>

                </form>

            </div>


            <!-- Order Summary -->
            <div class="order-box">

                <h2>🛒 Your Order</h2>

                <div id="checkoutItems">
                    <!-- Products will appear here -->
                </div>


                <div class="price-details">

                    <div class="price-row">
                        <span>Subtotal</span>
                        <span id="subtotal">₹0</span>
                    </div>

                    <div class="price-row">
                        <span>Delivery</span>
                        <span id="delivery">₹50</span>
                    </div>

                    <div class="price-row">
                        <span>Discount</span>
                        <span id="discount">₹0</span>
                    </div>

                    <hr>

                    <div class="total-row">
                        <span>Total</span>
                        <span id="total">₹0</span>
                    </div>

                </div>

            </div>

        </div>

    </section>


    <!-- Footer -->
    <footer>
        <p>© 2026 Aishu Mart | Handmade with ❤️</p>
    </footer>


    <script src="checkout.js"></script>

</body>
</html>
